name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # ponytail: hourly poll picks up Stream-Calculator pushes; swap for repository_dispatch from that repo if an hour is too slow
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Deploy the tip of each submodule's main, not the pinned commit
      - run: git submodule update --remote --recursive
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
